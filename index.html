/* Add Entry: fixed, non-scrolling composer matching the supplied reference. */
body.add-screen-open{overflow:hidden;overscroll-behavior:none}
.screen#add.active{
  position:fixed;z-index:5;display:flex;flex-direction:column;
  top:154px;left:50%;transform:translateX(-50%);
  width:min(100% - 26px,534px);
  height:calc(100dvh - 252px - env(safe-area-inset-bottom));
  min-height:0;overflow:hidden;overscroll-behavior:contain;
  padding:0 0 5px;gap:0;animation:none
}
.screen#add>h1,.screen#add>.sub{flex:none}
.screen#add>#entryTypes{order:1;flex:none;margin:12px 0 15px}
.screen#add>.fieldrow{order:2;flex:none;min-height:54px;margin:7px 0}
.screen#add>#entryAmountView{order:3;flex:none;margin:auto 0 8px;text-align:center}
.screen#add>#keypad{order:4;flex:none;margin:4px 0 0;gap:7px}
.screen#add>#keypad button{min-height:clamp(43px,7.2dvh,58px)}
.screen#add>button.primary{order:5;flex:none;margin-top:10px}
@media(max-height:760px){
 .screen#add.active{top:142px;height:calc(100dvh - 230px - env(safe-area-inset-bottom))}
 .screen#add>.fieldrow{min-height:43px;padding:9px;margin:5px 0}
 .screen#add>#entryTypes{margin:8px 0 10px}
 .screen#add>#keypad button{min-height:42px}
 .screen#add>#entryAmountView{margin-top:8px;font-size:30px}
}
.celebration-layer{position:fixed;inset:0;z-index:1000;pointer-events:none;overflow:hidden}
.celebration-layer .burst{position:absolute;left:var(--x);top:var(--y);width:7px;height:7px;border-radius:50%;background:hsl(var(--h),100%,65%);box-shadow:0 0 12px currentColor;animation:firework 850ms ease-out forwards}
@keyframes firework{0%{transform:translate(0,0) scale(.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15);opacity:0}}

:root[data-mode="light"] .assetbox,
:root[data-mode="light"] .menurow,
:root[data-mode="light"] .fieldrow,
:root[data-mode="light"] .monthbar,
:root[data-mode="light"] .pilltabs,
:root[data-mode="light"] .nav,
:root[data-mode="light"] .navdock,
:root[data-mode="light"] .topbtn,
:root[data-mode="light"] .quickpanel,
:root[data-mode="light"] .modal,

:root[data-mode="light"] .account-detail-card,

 bottom:calc(92px + env(safe-area-inset-bottom))!important;
}
#add.active>h1{font-size:24px!important;margin-bottom:5px!important}
#add.active>.sub{font-size:14px!important;margin-bottom:20px!important}
#add.active>#entryTypes{flex-basis:48px!important;height:48px!important;min-height:48px!important;margin-bottom:16px!important}
#add.active>#entryTypes button{font-size:12px!important}
#add.active>.fieldrow{
 flex-basis:46px!important;height:46px!important;min-height:46px!important;
 margin:6px 0!important;padding:9px 14px!important;font-size:14px!important;
}
#add.active>.fieldrow input{font-size:14px!important}
#add.active>#entryAmountView{
 flex-basis:62px!important;height:62px!important;line-height:62px!important;
 margin:12px 0 12px!important;font-size:39px!important;border-radius:20px!important;
}
#add.active>#keypad{margin:5px 6px 16px!important;gap:8px!important}
#add.active>#keypad button{font-size:23px!important;border-radius:19px!important}
#add.active>button.primary{
 flex-basis:50px!important;height:50px!important;min-height:50px!important;
 font-size:17px!important;
}
@media(max-height:760px){
 #add.active{top:122px!important;bottom:calc(88px + env(safe-area-inset-bottom))!important}
 #add.active>.sub{margin-bottom:12px!important}
 #add.active>#entryTypes{flex-basis:42px!important;height:42px!important;min-height:42px!important;margin-bottom:10px!important}
 #add.active>.fieldrow{flex-basis:40px!important;height:40px!important;min-height:40px!important;margin:3px 0!important}
 #add.active>#entryAmountView{flex-basis:50px!important;height:50px!important;line-height:50px!important;margin:7px 0!important;font-size:31px!important}
 #add.active>button.primary{flex-basis:43px!important;height:43px!important;min-height:43px!important}
}


/* Final dock visibility + keypad-only expansion */
.bottom{
 bottom:0!important;
 height:calc(82px + env(safe-area-inset-bottom))!important;
 min-height:calc(82px + env(safe-area-inset-bottom))!important;
 max-height:calc(82px + env(safe-area-inset-bottom))!important;
 padding:7px 12px calc(7px + env(safe-area-inset-bottom))!important;
}
@media(max-width:380px){
 .bottom{
  height:calc(76px + env(safe-area-inset-bottom))!important;
  min-height:calc(76px + env(safe-area-inset-bottom))!important;
  max-height:calc(76px + env(safe-area-inset-bottom))!important;
  padding-bottom:calc(7px + env(safe-area-inset-bottom))!important;
 }
}
@media(display-mode:standalone){.bottom{bottom:0!important}}
#add.active{bottom:calc(92px + env(safe-area-inset-bottom))!important}
#add.active>#keypad{
 flex:1 1 0!important;
 margin:3px 5px 8px!important;
 gap:7px!important;
 grid-template-rows:repeat(4,minmax(42px,1fr))!important;
}
