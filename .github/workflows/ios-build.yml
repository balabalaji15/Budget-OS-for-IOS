name: BudgetOS iOS Build
on:
  push:
    branches: ["ios-tauri-build"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: budgetos-ios-build
  cancel-in-progress: false
jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build React frontend
        run: npm run build
      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build iOS simulator
        run: cargo tauri ios build --target aarch64-apple-ios-sim
      - name: Package simulator app
        run: |
          mkdir -p release
          APP_PATH="$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)"
          if [ -n "$APP_PATH" ]; then ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release/BudgetOS-iOS-Simulator.zip; fi
      - name: Build signed device IPA
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing" release
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/certificate.p12"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/profile.mobileprovision"
          security create-keychain -p "" "$RUNNER_TEMP/signing/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/signing/build.keychain"
          security unlock-keychain -p "" "$RUNNER_TEMP/signing/build.keychain"
          security import "$RUNNER_TEMP/signing/certificate.p12" -k "$RUNNER_TEMP/signing/build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/signing/build.keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/budgetos.mobileprovision"
          cargo tauri ios build --target aarch64-apple-ios
          find src-tauri/gen/apple -name "*.ipa" -type f -exec cp {} release/BudgetOS.ipa \;
      - uses: actions/upload-artifact@v4
        with:
          name: BudgetOS-iOS-${{ github.run_number }}
          path: release/*
          if-no-files-found: warn
      - name: Create prerelease for signed IPA
        if: ${{ hashFiles('release/BudgetOS.ipa') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: BudgetOS iOS Build ${{ github.run_number }}
          prerelease: true
          files: release/*
